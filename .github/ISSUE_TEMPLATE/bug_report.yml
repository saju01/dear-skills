name: Bug report
description: Something didn't work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste real mail, names, addresses, chat text or calendar entries.** Redact them or use `example.com`.
  - type: input
    id: version
    attributes:
      label: Version
      description: From `skills/dear-inbox-zero/SKILL.md` or the zip name.
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: Agent
      options: [Copilot Cowork, GitHub Copilot, Other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `dear-inbox-zero doctor` (redacted)
      render: json
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed all personal data from this report.
          required: true
